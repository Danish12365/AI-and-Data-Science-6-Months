<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALL·E 3 Studio | Codanics</title>
    <style>
        body {
            background: linear-gradient(135deg, #121212 0%, #1a1a2e 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { margin: 0; font-weight: 800; letter-spacing: -1px; }
        
        .search-area {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        input {
            background: transparent;
            border: none;
            padding: 15px 25px;
            color: white;
            flex-grow: 1;
            font-size: 1rem;
            outline: none;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #4f46e5; transform: scale(1.05); }

        .result-card {
            margin-top: 3rem;
            max-width: 512px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .generated-img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .dl-btn {
            display: inline-block;
            text-decoration: none;
            color: #6366f1;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #6366f1;
            padding: 8px 20px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .dl-btn:hover { background: #6366f1; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DALL·E 3 <span style="color: #6366f1;">Studio</span></h1>
        <p>By Codanics</p>
    </div>

    <form class="search-area" method="post">
        <input type="text" name="prompt" placeholder="Describe the image in your mind..." required>
        <button type="submit">Generate</button>
    </form>

    {% if image_url %}
    <div class="result-card">
        <img src="{{ image_url }}" class="generated-img" alt="AI Generated Output">
        <a href="/download-image?image_url={{ image_url }}" class="dl-btn">Download High-Res</a>
    </div>
    {% endif %}

</body>
</html>
